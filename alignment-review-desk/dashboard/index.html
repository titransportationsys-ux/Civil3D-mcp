<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>Alignment Review Desk</title>
<style>
/* Layout: one working surface. Header (T&I logo, file, run) + seven tabs: Overview, Map, Signs, Catalogue, Setup, Export, Methods.
   Palette: T&I brand (Primary Green chrome, Charcoal headings, Neutral Tint paper). Red and amber mean "wrong" and "check" only; OK signs stay quiet slate. */
:root{
  --bg:#F4F6F5; --panel:#FFFFFF; --ink:#1A1F1C; --head:#434343; --muted:#6E6E6E; --line:#D9DFDC; --soft:#EAEFEC;
  --accent:#019945; --accent-ink:#FFFFFF; --accent2:#40B273; --wrong:#C4262E; --check:#B96A00; --okc:#3C6E8F;
  --map-bg:#FAFBFA; --map-kerb:#2C3733; --map-park:#C9D0CC; --map-cl:#B8505A; --map-bld:#9AA5A0; --map-node:#019945;
  --pal0:#0050E6; --pal1:#0A9A3E; --pal2:#E0007A; --pal3:#E85A00; --pal4:#7A2CF0; --pal5:#008FA6; --pal6:#7A4A12; --pal7:#9A7D00;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --panel:#172019; --ink:#E8EEEA; --head:#D6DDD9; --muted:#9AA8A1; --line:#2A3630; --soft:#1F2A24;
  --accent:#40B273; --accent-ink:#06210F; --accent2:#40B273; --wrong:#FF6B73; --check:#F2A640; --okc:#7FB2D4;
  --map-bg:#0B100D; --map-kerb:#C8D3CD; --map-park:#4A544F; --map-cl:#E58A93; --map-bld:#6C7A73; --map-node:#40B273;
  --pal0:#5C9DFF; --pal1:#3DDC84; --pal2:#FF5CB8; --pal3:#FF8A1F; --pal4:#B79BFF; --pal5:#35D6F0; --pal6:#D19A5C; --pal7:#FFD60A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1512; --panel:#172019; --ink:#E8EEEA; --head:#D6DDD9; --muted:#9AA8A1; --line:#2A3630; --soft:#1F2A24;
  --accent:#40B273; --accent-ink:#06210F; --accent2:#40B273; --wrong:#FF6B73; --check:#F2A640; --okc:#7FB2D4;
  --map-bg:#0B100D; --map-kerb:#C8D3CD; --map-park:#4A544F; --map-cl:#E58A93; --map-bld:#6C7A73; --map-node:#40B273;
  --pal0:#5C9DFF; --pal1:#3DDC84; --pal2:#FF5CB8; --pal3:#FF8A1F; --pal4:#B79BFF; --pal5:#35D6F0; --pal6:#D19A5C; --pal7:#FFD60A; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding:0 max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1280px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:16px 0 10px}
.logoBox{display:block;margin:0 0 8px}
.logo{height:56px;width:auto;background:#fff;border-radius:6px;padding:2px 6px;display:block}
h1{font:600 30px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--head)}
h1 small{display:block;font:400 12px/1.4 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:4px}
h2{font:600 20px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px;color:var(--head)}
h3{font:700 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.hbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:7px 12px;min-height:34px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.primary:hover{filter:brightness(1.07)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 8px;min-height:32px;max-width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip b{font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:6px;vertical-align:-1px}
.dot.wrong{background:var(--wrong)} .dot.check{background:var(--check);transform:rotate(45deg)} .dot.ok{background:var(--okc);border-radius:50%}
.prog{display:flex;align-items:center;gap:10px;min-width:260px} .prog .pb{flex:1;height:8px;min-width:110px;background:var(--soft);border-radius:4px;overflow:hidden} .prog .pb i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.chip{font:500 12px/1 var(--f-mono);padding:6px 9px;border:1px solid var(--line);border-radius:3px;background:var(--panel);white-space:nowrap}
.draft{border-left:4px solid var(--check);background:var(--soft);padding:8px 12px;margin:0 0 12px;font-size:13px}
nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto;margin-bottom:16px}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 16px;font:600 17px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:-2px}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .n{font:500 11px var(--f-mono);margin-left:6px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:var(--f-mono);font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font:700 11px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer} th.s:hover{color:var(--ink)}
td{padding:5px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--soft)} tr.sel td{background:var(--soft);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi b{display:block;font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums} .kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi.wrong{border-left-color:var(--wrong)} .kpi.check{border-left-color:var(--check)} .kpi.ok{border-left-color:var(--okc)} .kpi.acc{border-left-color:var(--accent)}
.pill{font:700 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.pill.wrong{color:var(--wrong)} .pill.check{color:var(--check)} .pill.ok{color:var(--okc)} .pill.acc{color:var(--accent)}
.barrow{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;padding:4px;width:100%;text-align:left;border:0;background:none;min-height:0;border-radius:4px}
.barrow:hover{background:var(--soft)} .barrow .ct{font:500 13px var(--f-mono);text-align:right}
.bar2{display:flex;height:14px;background:var(--soft);border-radius:2px;overflow:hidden} .bar2 i{display:block;height:100%}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex} .seg button{border-radius:0;margin-left:-1px;padding:5px 12px;min-height:30px} .seg button:first-child{border-radius:4px 0 0 4px;margin-left:0} .seg button:last-child{border-radius:0 4px 4px 0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fchip[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.fchip[aria-pressed=false]{opacity:.55}
.fchip{padding:4px 10px;min-height:28px;font-size:12px}
.dd{position:relative} .dd summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--panel);min-height:32px;display:inline-flex;align-items:center}
.dd summary::-webkit-details-marker{display:none} .ddbody{position:absolute;z-index:8;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:6px;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.ddbody label{display:flex;align-items:center;gap:8px}
.mapwrap{position:relative;height:clamp(420px,64vh,740px);border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--map-bg);touch-action:none}
#cv{width:100%;height:100%;display:block;cursor:grab} #cv.drag{cursor:grabbing}
.legend{position:absolute;left:10px;top:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12px;display:grid;gap:4px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-2px;border-radius:2px}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:4px} .zoom button{width:36px;padding:0;font-size:18px;line-height:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:4px 8px;border-radius:3px;font-size:12px;max-width:280px;display:none;z-index:3}
.coord{position:absolute;right:10px;bottom:8px;font:11px var(--f-mono);color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:2px 6px;border-radius:3px;pointer-events:none}
.mapwrap:fullscreen{height:100vh;border:0;border-radius:0}
.sel .t{font:600 22px/1.15 var(--f-display);letter-spacing:.02em}
.dec{display:inline-flex} .dec button{border-radius:0;margin-left:-1px;min-height:30px;padding:4px 10px} .dec button:first-child{border-radius:4px 0 0 4px;margin-left:0} .dec button:last-child{border-radius:0 4px 4px 0}
.dec button[aria-pressed=true].keep{background:var(--okc);color:#fff;border-color:var(--okc)}
.dec button[aria-pressed=true].fix{background:var(--check);color:#fff;border-color:var(--check)}
.dec button[aria-pressed=true].remove{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px 20px}
.form label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.notice{border-left:3px solid var(--check);background:var(--soft);padding:8px 12px;margin-bottom:12px;font-size:13px}
.notice.err{border-color:var(--wrong)}
.method h2{margin-top:6px} .method p,.method li{max-width:92ch} .method ul{margin:6px 0 10px;padding-left:20px}
.eq{background:var(--soft);border-radius:4px;padding:10px 12px;font:13px/1.7 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
.fig svg{display:block;width:100%;max-width:560px;height:auto}
.flow{overflow-x:auto} .flow svg{min-width:880px;max-width:none}
.flow .fb{fill:var(--panel);stroke:var(--line);stroke-width:1.5} .flow .fb.k{stroke:var(--accent);stroke-width:2.2} .flow .fb.q{fill:var(--soft);stroke:var(--check);stroke-width:1.8}
.flow .ft{font:700 12px var(--f-body);fill:var(--ink)} .flow .fs{font:11px var(--f-body);fill:var(--muted)} .flow .fl{font:11px var(--f-mono);fill:var(--muted)} .flow .fn{font:700 11px var(--f-mono);fill:var(--accent)}
.flow .fa{fill:none;stroke:var(--muted);stroke-width:1.6} .flow .fa.l{stroke:var(--check);stroke-dasharray:5 4}
.who{font:700 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:3px;background:var(--soft);color:var(--muted);margin-right:6px;white-space:nowrap}
.who.you{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--ink)} .fig text{fill:var(--ink);font:12px var(--f-body)}
textarea.out{width:100%;min-height:150px;font:12px/1.4 var(--f-mono)}
.empty{padding:28px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:560px){h1{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="logoBox"><img id="logo" class="logo" alt="Talaat &amp; Imam Consulting Engineers"></span>Alignment Review Desk<small id="sub">Check the signs in a signing DXF against the MUTCD, Egyptian and SHC catalogue. Only problem areas are marked.</small></h1>
  <div class="hbar">
    <span class="chip" id="fileChip">no drawing</span>
    <input type="file" id="file" accept=".dxf" hidden>
    <button id="btnLoad">Load DXF</button>
    <button id="btnDemo">Load demo</button>
    <button id="btnRun" class="primary">Run checks</button>
    <div class="prog" id="prog" hidden role="status"><div class="pb"><i id="progBar"></i></div><span class="small" id="progTxt">Working</span></div>
  </div>
</header>
<div class="chips" id="summary" aria-live="polite" style="margin-bottom:12px"></div>
<div class="draft" id="draft"></div>
<div id="notices"></div>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-v="overview">Overview</button>
  <button role="tab" data-v="map">Map</button>
  <button role="tab" data-v="signs">Signs<span class="n" id="nSigns"></span></button>
  <button role="tab" data-v="setup">Setup</button>
  <button role="tab" data-v="export">Export</button>
  <button role="tab" data-v="method">Methods</button>
  <button role="tab" data-v="cat">Catalogue</button>
</nav>

<section id="v-overview"></section>

<section id="v-map" hidden>
  <div class="fbar" id="fbMap"></div>
  <div class="fbar">
    <span class="muted small">Colour signs</span>
    <div class="seg" id="segColor"><button data-c="status" aria-pressed="true">By check</button><button data-c="code" aria-pressed="false">By code</button><button data-c="family" aria-pressed="false">By family</button></div>
    <details class="dd"><summary>Layers</summary><div class="ddbody">
      <label><input type="checkbox" data-lv="kerb" checked>Carriageway edges</label><label><input type="checkbox" data-lv="park" checked>Parking</label>
      <label><input type="checkbox" data-lv="cl" checked>Centrelines</label><label><input type="checkbox" data-lv="bld" checked>Buildings</label>
      <label><input type="checkbox" data-lv="nodes" checked>Junctions and link names</label><label><input type="checkbox" data-lv="signs" checked>Signs</label><label><input type="checkbox" data-lv="lbl" checked>Sign labels</label></div></details>
    <input type="search" id="mapSearch" placeholder="Find sign, e.g. S0020" size="18" aria-label="Find a sign by ID">
    <button id="btnMeasure" aria-pressed="false">Measure</button>
    <form id="gotoForm" class="hbar" style="gap:4px"><input type="text" id="gotoIn" placeholder="Go to E, N" size="20" aria-label="Go to E, N"><button type="submit">Go</button></form>
    <button id="btnFs">Fullscreen</button><span class="mono small muted" id="measureOut"></span>
  </div>
  <div class="mapwrap" id="mapwrap">
    <canvas id="cv"></canvas>
    <div class="legend" id="legend"></div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Fit drawing" style="font-size:12px">Fit</button></div>
    <div class="tip" id="tip"></div><div class="coord" id="coord"></div>
  </div>
  <div class="card sel" id="selCard" style="margin-top:12px" hidden></div>
</section>

<section id="v-signs" hidden></section>
<section id="v-cat" hidden></section>
<section id="v-setup" hidden></section>
<section id="v-export" hidden></section>
<section id="v-method" hidden class="method"></section>
</div>

    <p class="muted small">Every output is <b>DRAFT</b> while the rulebook is not signed off by a T&amp;I engineer. Rulebook ${esc(DATA.rb.code)} is currently <b>${esc(DATA.rb.status)}</b>.</p></div>


  <div class="card"><h2>What the engine does, in order</h2>
    <p>The signing engine behind this page turns a road network into a draft signing and marking design. For each situation on the network that a traffic-control manual says needs a sign or marking, it works out which device is needed and exactly where it goes. In audit mode it makes the same design and compares it with an existing sign inventory.</p>
    <ol style="padding-left:20px;margin:8px 0">
      <li><b>Reads the network</b> from a DXF, GeoJSON or CSV. Centrelines (and kerb lines, if supplied) become links and nodes.</li>
      <li><b>Asks for what is missing.</b> Road class, speed, lanes, one-way, urban or rural, and the control type at each junction are never assumed. The run stops with questions (exit 2) until you answer.</li>
      <li><b>Detects triggers</b>, the situations that call for a device: stop, yield, signal and roundabout approaches, uncontrolled major roads, speed changes, lane drops, divided-road changes, merges, curves, one-way streets, crosswalks, school zones, grade crossings and 34 hazard types, plus the base markings on every link. There are 56 triggers (22 general, 34 hazard).</li>
      <li><b>Looks up the rule</b> for each trigger in the rulebook (MUTCD 11th Edition today). The rule gives the device, its class (Mandatory, Recommended, Optional or Conditional) and the clause behind it.</li>
      <li><b>Places each device:</b> how far before the trigger, which side, how far from the kerb, at what height and facing which way. It then keeps the required spacing between posts and reports conflicts.</li>
      <li><b>Records every device</b> with its code, clause, position, size, confidence and notes.</li>
      <li><b>Writes the outputs when you ask:</b> the sign schedule, GeoJSON, a DXF in the T&amp;I drawing style, and a report.</li>
    </ol>
    <p class="small muted">The design logic (triggers and placement) is shared across codes. Adding the Egyptian or SHC code means adding its own rulebook files, not changing the engine, once their sources are available.</p></div>

  <div class="card"><h2>What it deliberately is not</h2><ul>
    <li><b>It does not compute sight distance.</b> STOP, YIELD and Signal Ahead stay Conditional until you confirm visibility.</li>
    <li><b>It does not design guide signs or temporary traffic control.</b> Guide signs need a destinations list.</li>
    <li><b>It does not place chevron and arrow pavement markings</b> (TI-614 to TI-619, L13-1 to L13-6). The rule is still to be given by T&amp;I.</li>
    <li><b>It never fills a missing value silently.</b> It asks, and a question you skip is recorded as skipped.</li>
    <li><b>It never mixes codes.</b> No MUTCD value is carried into an Egyptian or SHC rulebook, and no sign is matched by look-alike.</li>
    <li><b>Its output is a draft.</b> Everything stays DRAFT until a T&amp;I engineer signs off the rulebook.</li></ul></div>

  <div class="grid2">
  <div class="card"><h2>1. Reading the drawing</h2><ul>
    <li>The DXF is read in your browser; nothing is uploaded. Lines, polylines (with arcs), arcs, block inserts and single-line text are used; other entities are ignored.</li>
    <li>You assign a role to each layer (Setup): sign blocks, sign labels, centreline, carriageway edge, parking, buildings, or ignore.</li>
    <li>A <b>sign</b> is one block insert matched to one label of the form <span class="mono">CODE Snnnn</span> (for example <span class="mono">R1-1 S0001</span>). Each position takes its nearest unused labels (within the label radius, default 6 m). Where several signs share a position, the labels are matched to the blocks whose code fits: the approved T&amp;I block, or the engine symbol for that code's shape.</li>
    <li>Inserts left without a label are reported, not dropped. Signs at one position are different signs, not duplicates, unless they share a code.</li></ul></div>
  <div class="card"><h2>2. Network and link names</h2><ul>
    <li>Centreline ends within 1 m join into one node. A free end within 12 m of another centreline joins it as a T-junction, and that line is split there.</li>
    <li>Links are named <b>node-to-node</b>, for example <span class="mono">N009-N010</span>. Two links between the same nodes get a <span class="mono">~</span> suffix.</li>
    <li>The Wyte demo uses the engine's own node numbers. A drawing you load gets provisional numbers (<span class="mono">n01</span>, <span class="mono">n02</span>, north to south); the engine's N-numbers apply after an engine run.</li></ul></div></div>

  <div class="card"><h2>3. The checks</h2><div class="scroll"><table><thead><tr><th>Check</th><th>Severity</th><th>Rule</th><th>Why it matters</th></tr></thead><tbody>
    ${CHECKS.map(k => `<tr><td><b>${esc(k.name)}</b></td><td><span class="pill ${k.sev === 'info' ? 'acc' : k.sev}">${k.sev === 'info' ? 'report' : k.sev}</span></td><td>${esc(k.rule)}</td><td>${esc(k.why)}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Wrong = the drawing contradicts the block map or the offset rule. To check = unusual, and may be intended. Kerb measurements come from the drawn kerb lines, simplified to 0.12 m, so a result within 0.1 m of a limit is a close call. A sign with no finding is not certified correct: the checks look for the problems listed above and nothing else.</p></div>

  <div class="grid2">
  <div class="card fig"><h2>4. Which side of the road</h2>
    <p>For STOP and YIELD, the sign must be on the right of the traffic that approaches the junction (right-hand traffic, Egypt).</p>
    <div class="eq">q  = nearest point on the nearest centreline
J  = the nearer end node of that link (the junction)
t  = J − q            (direction of travel toward J)
c  = t.x·(sign.y − q.y) − t.y·(sign.x − q.x)
side = right if c &lt; 0, left if c ≥ 0</div>
    <svg viewBox="0 0 420 150" role="img" aria-label="Side test: the junction J lies ahead; a sign below the travel line is on the right, above is on the left">
      <line x1="30" y1="75" x2="330" y2="75" stroke="currentColor" stroke-dasharray="7 5" opacity=".5"/>
      <path d="M40 75 L320 75" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#ah)"/>
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>
      <circle cx="350" cy="75" r="7" fill="var(--map-node)"/><text x="336" y="60">J</text><text x="44" y="68">q</text><text x="70" y="96" fill="currentColor" font-size="11">travel →</text>
      <polygon points="150,112 166,112 158,126" fill="var(--okc)"/><text x="174" y="124">right (c &lt; 0): expected</text>
      <polygon points="150,38 166,38 158,52" fill="var(--check)"/><text x="174" y="38">left (c ≥ 0): check</text></svg></div>
  <div class="card"><h2>5. Catalogue and crosswalk</h2><ul>
    <li>Each code keeps its own catalogue: MUTCD 11th Edition (${DATA.cat.length} signs, names from the printed tables), the Egyptian code (Code 104, Part 2) and SHC. A name or clause is shown only from its own code's source.</li>
    <li>The <b>link table</b> says which signs are the same device. A link is <b>approved</b> only when a T&amp;I engineer has approved it; the ${DATA.mlinks.filter(r => r[7] === 'yes').length} approved links come from the T&amp;I block map ("for now"). No link is made by look-alike.</li>
    <li>Egyptian numbers come from T&amp;I block names and stay unverified until read from the printed code. Egyptian names and SHC are empty until those sources are read.</li>
    <li>Egyptian clauses use Egyptian numbering only; MUTCD numbers are never used in an Egyptian field, or the reverse.</li></ul></div></div>

  <div class="grid2">
  <div class="card"><h2>6. Limits</h2><ul>
    <li>Checks cover only the problems listed in section 3. They do not compute sight distance, advisory speeds or sign spacing, and they do not judge whether a sign is required there.</li>
    <li>Sign class (Mandatory, Recommended, Optional, Conditional) and clause come from an engine run, not from the drawing; this page does not add them.</li>
    <li>Guide signs, temporary traffic control, and chevron and arrow placement (TI-614 to TI-619, L13-n) are not covered.</li>
    <li>Bulged polylines and arcs are read; splines, hatches and nested blocks are not.</li>
    <li>Right-hand traffic is assumed; the side test is meaningless for left-hand traffic.</li>
    <li>On a drawing you load, the side test uses this page's simplified network, which can differ from the engine's (for Wyte: 17 links against 18, and one extra left-side finding). Treat the engine run as the reference.</li></ul></div>
  <div class="card"><h2>7. Status and sources</h2><ul>
    <li>Sign names: MUTCD 11th Edition tables, checked against the T&amp;I copy of the PDF (30 Sep 2026).</li>
    <li>Block map: 28 approved rows, of which 13 are "check" matches T&amp;I still has to confirm.</li>
    <li>Open: Egyptian PDF to read, SHC source, 54 unverified MUTCD rules, engineer sign-off.</li>
    <li>Demo data: <span class="mono">Wyte_Signing_1.dxf</span> (signs, labels) on the network of <span class="mono">Wyte.dxf</span> (layers TI - CL, TI - CW, TI - Parking, TI - BM).</li>
    <li>Your decisions are stored in this browser only. Use Export to copy them.</li></ul></div></div>`;
}

  prog(true, 'Reading ' + f.name, 15);
  const rd = new FileReader(); rd.onload = async () => {
    try {

      const { ents, skipped } = parseDxf(rd.result), layers = {};
      ents.forEach(en => { const l = layers[en.layer] = layers[en.layer] || { types: {}, role: 'ignore' }; l.types[en.type] = (l.types[en.type] || 0) + 1; });
      Object.entries(layers).forEach(([n, l]) => l.role = guessRole(n, l));

  }; rd.readAsText(f); e.target.value = '';

function guessRole(n, l) {
  const s = n.toLowerCase(), t = l.types;
  if (/sign/.test(s) && t.INSERT) return 'signs'; if (/text|label|anno/.test(s) && t.TEXT) return 'labels'; if (/(^|[^a-z])cl([^a-z]|$)|centre|center/.test(s)) return 'cl';
  if (/(^|[^a-z])cw([^a-z]|$)|kerb|curb|edge|carriageway/.test(s)) return 'kerb'; if (/park/.test(s)) return 'park'; if (/(^|[^a-z])bm([^a-z]|$)|build/.test(s)) return 'bld'; return 'ignore';
}

  const by = r => UPLOAD.ents.filter(e => UPLOAD.layers[e.layer].role === r), lines = r => by(r).filter(e => e.pts).map(e => e.pts);
  const cl = lines('cl'), net = cl.length ? buildNetwork(cl) : { nodes: {}, links: [] };
  RAW = { file: UPLOAD.file, ins: by('signs').filter(e => e.type === 'INSERT').map(e => [e.name, e.x, e.y, e.rot]), lab: by('labels').filter(e => e.type === 'TEXT').map(e => [e.text, e.x, e.y]),
    net, kerb: lines('kerb'), park: lines('park'), cl, bld: by('bld').filter(e => e.type === 'INSERT').map(e => [e.x, e.y]), bmap: DATA.bmap, cat: DATA.cat, demo: false };
}
$('#logo').src = LOGO;
$('#draft').innerHTML = `<b>DRAFT.</b> Rulebook ${esc(DATA.rb.code)} status: ${esc(DATA.rb.status)}. Findings are read from the drawing and are not signed off by a T&amp;I engineer.`;
loadDemo(); showTab(location.hash.slice(1) || 'overview');
</script>
